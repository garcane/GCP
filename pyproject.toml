[project]
name = "gcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jsonschema>=4.26.0",
    "marimo>=0.25.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "referencing>=0.37.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/ml", "src/transformation", "src/analytics", "src/powerbi", "tests"]
markers = ["warehouse: needs the built warehouse.duckdb (skipped when it is missing)"]
